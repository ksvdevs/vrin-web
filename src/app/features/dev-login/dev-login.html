<main class="login-page">
  <p-card>
    <div class="login-container">
      <div class="logo-container">
        <i class="pi pi-play" style="color: #0d9488; font-size: 2.5rem; margin-bottom: 1rem;"></i>
        <h2>SGR-VRIN</h2>
        <p class="subtitle">Sistema de Gestión de Resoluciones</p>
      </div>

      <div class="login-actions">
        <p-button 
          label="Ingresar con cuenta institucional (@unamba.edu.pe)" 
          icon="pi pi-google" 
          severity="secondary" 
          styleClass="google-btn w-full"
          (onClick)="loginConGoogle()"
        />
      </div>

      <div class="divider">
        <span>O</span>
      </div>

      <div class="login-actions">
        <p-button 
          label="Solicitar Acceso" 
          icon="pi pi-user-plus" 
          [text]="true" 
          styleClass="w-full"
          (onClick)="solicitarAccesoVisible = true"
        />
      </div>
    </div>
  </p-card>

  <p-dialog header="Solicitar Acceso" [(visible)]="solicitarAccesoVisible" [modal]="true" [style]="{width: '450px'}">
    <div class="flex flex-col gap-3">
      <div class="flex flex-col gap-2">
        <label for="nombres">Nombres</label>
        <input pInputText id="nombres" [(ngModel)]="solicitud.nombres" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="apellidos">Apellidos</label>
        <input pInputText id="apellidos" [(ngModel)]="solicitud.apellidos" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="dni">DNI</label>
        <input pInputText id="dni" [(ngModel)]="solicitud.dni" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="email">Correo Institucional</label>
        <input pInputText id="email" [(ngModel)]="solicitud.email" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="dependencia">Dependencia</label>
        <input pInputText id="dependencia" [(ngModel)]="solicitud.dependencia" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="cargo">Cargo</label>
        <input pInputText id="cargo" [(ngModel)]="solicitud.cargo" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="motivo">Motivo</label>
        <textarea pTextarea id="motivo" [(ngModel)]="solicitud.motivo" rows="3"></textarea>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <p-button label="Cancelar" icon="pi pi-times" [text]="true" (onClick)="solicitarAccesoVisible = false" />
      <p-button label="Enviar Solicitud" icon="pi pi-check" (onClick)="enviarSolicitud()" [loading]="enviando" />
    </ng-template>
  </p-dialog>
</main>
