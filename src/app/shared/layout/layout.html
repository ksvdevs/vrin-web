<div class="layout-wrapper">
  <aside class="sidebar">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="pi pi-play" style="color: white; font-size: 0.8rem"></i>
      </div>
      <div class="logo-text">
        <span class="font-bold text-gray-900">SGR</span>-<span class="font-bold text-teal-600">VRIN</span>
        <span class="version text-500 text-sm">1.0</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="pi pi-th-large"></i>
        <span>Panel de control</span>
      </a>

      @if (esAdmin) {
        <div class="nav-item has-submenu" (click)="togglePersonal()" [class.active]="isPersonalOpen">
          <div class="nav-item-content">
            <i class="pi pi-users"></i>
            <span>Personal</span>
          </div>
          <i class="pi submenu-icon" [class]="isPersonalOpen ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
        </div>

        @if (isPersonalOpen) {
          <div class="submenu-container">
            <a class="nav-item submenu-item" routerLink="/roles" routerLinkActive="active">
              <i class="pi pi-id-card"></i>
              <span>Roles</span>
            </a>

            <a class="nav-item submenu-item" routerLink="/usuarios" routerLinkActive="active">
              <i class="pi pi-user"></i>
              <span>Usuarios</span>
            </a>
          </div>
        }

        <a class="nav-item" routerLink="/catalogos/docentes" routerLinkActive="active">
          <i class="pi pi-id-card"></i>
          <span>Docentes</span>
        </a>

        <a class="nav-item" routerLink="/plantillas" routerLinkActive="active">
          <i class="pi pi-file-edit"></i>
          <span>Gestor de Plantillas</span>
        </a>
      }

      <div class="nav-section-title">INVESTIGACIÓN</div>

      <a class="nav-item highlighted" routerLink="/expedientes" routerLinkActive="active">
        <i class="pi pi-book"></i>
        <span>Artículos Financiados</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-spacer"></div>
      <div class="user-profile relative">
        <div class="avatar">{{ inicial }}</div>
        <div class="flex flex-col ml-2 cursor-pointer" (click)="menu.toggle($event)">
          <span class="user-name">{{ usuario?.nombre }}</span>
          <span class="text-xs text-gray-500">{{ usuario?.rol }}</span>
        </div>
        <p-menu #menu [model]="[{label: 'Cerrar Sesión', icon: 'pi pi-sign-out', command: cerrarSesion.bind(this)}]" [popup]="true"></p-menu>
      </div>
    </header>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
