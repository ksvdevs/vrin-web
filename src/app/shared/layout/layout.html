<div class="layout-wrapper" [class.menu-contraido]="menuContraido">
  <aside class="sidebar" aria-label="Menú principal">
    <a class="logo-container" routerLink="/" aria-label="SGR VRIN, inicio">
      <span class="logo-icon"><i class="pi pi-circle" aria-hidden="true"></i></span>
      <span class="logo-text"
        ><strong>SGR–VRIN</strong><small>Gestión de investigación</small></span
      >
    </a>
    <nav class="sidebar-nav">
      <div class="nav-section-title">General</div>
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        title="Panel de control"
      >
        <i class="pi pi-th-large" aria-hidden="true"></i><span>Panel de control</span>
      </a>
      @if (esAdmin) {
        <button
          type="button"
          class="nav-item"
          (click)="togglePersonal()"
          [attr.aria-expanded]="isPersonalOpen"
          aria-controls="submenu-personal"
          title="Personal"
        >
          <i class="pi pi-users" aria-hidden="true"></i><span>Personal</span>
          <i class="pi pi-angle-right submenu-icon" aria-hidden="true"></i>
        </button>
        @if (isPersonalOpen && !menuContraido) {
          <div class="submenu-container" id="submenu-personal">
            <a routerLink="/roles" routerLinkActive="active">Roles</a>
            <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
          </div>
        }
        <a
          class="nav-item"
          routerLink="/catalogos/docentes"
          routerLinkActive="active"
          title="Docentes"
        >
          <i class="pi pi-user" aria-hidden="true"></i><span>Docentes</span>
        </a>
        <a
          class="nav-item"
          routerLink="/plantillas"
          routerLinkActive="active"
          title="Gestor de plantillas"
        >
          <i class="pi pi-objects-column" aria-hidden="true"></i><span>Gestor de plantillas</span>
        </a>
      }
      <div class="nav-section-title investigacion">Investigación</div>
      <a
        class="nav-item"
        routerLink="/expedientes"
        routerLinkActive="active"
        title="Artículos financiados"
      >
        <i class="pi pi-file" aria-hidden="true"></i><span>Artículos financiados</span>
      </a>
    </nav>
    <button
      type="button"
      class="contraer-menu"
      (click)="menuContraido = !menuContraido"
      [attr.aria-label]="menuContraido ? 'Expandir menú' : 'Contraer menú'"
      [attr.aria-expanded]="!menuContraido"
    >
      <i
        class="pi"
        [class.pi-angle-right]="!menuContraido"
        [class.pi-angle-left]="menuContraido"
        aria-hidden="true"
      ></i
      ><span>Contraer menú</span>
    </button>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <nav class="breadcrumb" aria-label="Ubicación actual">
        <span>{{ seccionActual }}</span
        ><i class="pi pi-angle-right" aria-hidden="true"></i><strong>{{ paginaActual }}</strong>
      </nav>
      <button
        type="button"
        class="user-profile"
        (click)="menu.toggle($event)"
        aria-label="Menú de usuario"
        aria-haspopup="menu"
      >
        <span class="avatar">{{ inicial }}</span>
        <span class="user-info"
          ><span class="user-name">{{ usuario?.nombre }}</span
          ><span class="user-role">{{
            esAdmin ? 'Administrador general' : usuario?.rol
          }}</span></span
        >
        <i class="pi pi-angle-right" aria-hidden="true"></i>
      </button>
      <p-menu
        #menu
        [model]="[
          { label: 'Cerrar sesión', icon: 'pi pi-sign-out', command: cerrarSesion.bind(this) },
        ]"
        [popup]="true"
        appendTo="body"
      />
    </header>
    <div class="content-area"><router-outlet /></div>
  </main>
</div>
